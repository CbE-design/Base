# fly.toml app configuration file generated for infura on 2025-11-12T15:48:25Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'infura'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[processes]
  app = 'anvil --host 0.0.0.0 --port 8080 --chain-id 8453 --state /data/anvil-state.json'

[[mounts]]
  source = 'anvil_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[restart]]
  policy = 'always'

[[vm]]
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 1024
